<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(60% 55% at 74% 42%, rgba(217,119,87,0.30), transparent 60%),
      radial-gradient(50% 60% at 22% 95%, rgba(126,96,196,0.12), transparent 60%),
      linear-gradient(155deg,#221a16 0%,#160f0c 58%,#0d0908 100%);
    color:#fff; position:relative;
  }
  /* dezenter Punkt-Grid (gleiche DNA wie der Bodenstation-Header) */
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:620px; }
  .kicker { font-size:20px; letter-spacing:6px; font-weight:700; color:#e0916f; text-transform:uppercase; }
  .kicker .dot { color:#d97757; }
  h1 { font-size:63px; line-height:1.06; font-weight:800; letter-spacing:-1.3px; margin:22px 0 0; }
  h1 .accent { color:#e58a68; }
  .sub { margin-top:24px; font-size:27px; font-weight:500; color:#c3b7ae; letter-spacing:-.2px; }
  .by { margin-top:40px; font-size:19px; color:#8c8079; }
  .by b { color:#cbbfb6; font-weight:600; }
  .art { position:absolute; right:44px; top:0; height:675px; width:520px; }
  /* offizielles Claude-Logo (Asset aus dem Bodenstation-Artikel), via CSS-mask in
     Claude-Coral eingefaerbt: ein kleiner Agent pro Terminal-Spur */
  .agent { position:absolute; width:28px; height:28px; background:#d97757;
    -webkit-mask:url("claude.svg") center/contain no-repeat;
    mask:url("claude.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 10px rgba(217,119,87,0.65)); }
  .agent.a1 { left:39px;  top:191px; }
  .agent.a2 { left:194px; top:111px; }
  .agent.a3 { left:349px; top:261px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker">agentic<span class="dot">.</span>schule</div>
      <h1>Agentic&nbsp;Coding<br><span class="accent">auf mehreren Spuren</span></h1>
      <div class="sub">git worktrees für parallele KI-Agenten</div>
      <div class="by">von <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="520" height="675" viewBox="0 0 520 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e88a63" stop-opacity="0.50"/>
          <stop offset="55%" stop-color="#d97757" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="branch" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#d97757"/>
          <stop offset="100%" stop-color="#f2b79f"/>
        </linearGradient>
      </defs>

      <!-- Glow hinter dem Verzweigungspunkt -->
      <circle cx="260" cy="420" r="150" fill="url(#glow)"/>

      <!-- Stamm (main) mit Commits -->
      <line x1="260" y1="660" x2="260" y2="430" stroke="#8a7a6e" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="260" cy="638" r="5" fill="#a08f82"/>
      <circle cx="260" cy="584" r="5" fill="#a08f82"/>
      <circle cx="260" cy="530" r="5" fill="#a08f82"/>
      <circle cx="260" cy="480" r="5" fill="#a08f82"/>

      <!-- drei Spuren zweigen ab -->
      <path d="M260 430 C260 355, 105 355, 105 267" stroke="url(#branch)" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M260 430 L260 187"                   stroke="url(#branch)" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M260 430 C260 380, 415 400, 415 337" stroke="url(#branch)" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- Verzweigungspunkt + Branch-Spitzen -->
      <circle cx="260" cy="430" r="7"   fill="#d97757"/>
      <circle cx="105" cy="267" r="4.5" fill="#e58a68"/>
      <circle cx="260" cy="187" r="4.5" fill="#e58a68"/>
      <circle cx="415" cy="337" r="4.5" fill="#e58a68"/>

      <!-- Terminal 1 (links) -->
      <g>
        <rect x="25" y="155" width="160" height="110" rx="10" fill="#1d1713" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
        <circle cx="41" cy="169" r="3.5" fill="rgba(255,255,255,0.18)"/>
        <circle cx="53" cy="169" r="3.5" fill="rgba(255,255,255,0.18)"/>
        <circle cx="65" cy="169" r="3.5" fill="rgba(255,255,255,0.18)"/>
        <rect x="77" y="195" width="66" height="7" rx="3.5" fill="#d97757" opacity="0.75"/>
        <rect x="77" y="209" width="88" height="7" rx="3.5" fill="rgba(255,255,255,0.18)"/>
        <rect x="39" y="231" width="112" height="7" rx="3.5" fill="rgba(255,255,255,0.12)"/>
        <rect x="157" y="230" width="7" height="9" fill="#d97757" opacity="0.9"/>
      </g>

      <!-- Terminal 2 (Mitte, oben) -->
      <g>
        <rect x="180" y="75" width="160" height="110" rx="10" fill="#1d1713" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
        <circle cx="196" cy="89" r="3.5" fill="rgba(255,255,255,0.18)"/>
        <circle cx="208" cy="89" r="3.5" fill="rgba(255,255,255,0.18)"/>
        <circle cx="220" cy="89" r="3.5" fill="rgba(255,255,255,0.18)"/>
        <rect x="232" y="115" width="66" height="7" rx="3.5" fill="#d97757" opacity="0.75"/>
        <rect x="232" y="129" width="80" height="7" rx="3.5" fill="rgba(255,255,255,0.18)"/>
        <rect x="194" y="151" width="112" height="7" rx="3.5" fill="rgba(255,255,255,0.12)"/>
        <rect x="312" y="150" width="7" height="9" fill="#d97757" opacity="0.9"/>
      </g>

      <!-- Terminal 3 (rechts) -->
      <g>
        <rect x="335" y="225" width="160" height="110" rx="10" fill="#1d1713" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
        <circle cx="351" cy="239" r="3.5" fill="rgba(255,255,255,0.18)"/>
        <circle cx="363" cy="239" r="3.5" fill="rgba(255,255,255,0.18)"/>
        <circle cx="375" cy="239" r="3.5" fill="rgba(255,255,255,0.18)"/>
        <rect x="387" y="265" width="66" height="7" rx="3.5" fill="#d97757" opacity="0.75"/>
        <rect x="387" y="279" width="92" height="7" rx="3.5" fill="rgba(255,255,255,0.18)"/>
        <rect x="349" y="301" width="112" height="7" rx="3.5" fill="rgba(255,255,255,0.12)"/>
        <rect x="467" y="300" width="7" height="9" fill="#d97757" opacity="0.9"/>
      </g>
    </svg>
    <div class="agent a1"></div>
    <div class="agent a2"></div>
    <div class="agent a3"></div>
  </div>
</body>
</html>
