<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body { font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background: radial-gradient(60% 55% at 74% 42%, rgba(98,38,176,0.34), transparent 60%),
      radial-gradient(50% 60% at 22% 95%, rgba(233,4,100,0.16), transparent 60%),
      linear-gradient(155deg,#241a33 0%,#1b1525 58%,#0d0913 100%); color:#fff; position:relative; }
  .grid { position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .brand { position:absolute; top:60px; left:78px; height:56px; }
  h1 { position:absolute; top:170px; left:78px; right:78px; font-size:52px; font-weight:800; letter-spacing:-1.5px; line-height:1.05; }
  h1 .accent { background:linear-gradient(92deg,#a06bff 0%,#e90464 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .cards { position:absolute; left:78px; right:78px; top:300px; display:flex; gap:32px; }
  .card { flex:1; background:#211830; border:1.5px solid rgba(255,255,255,0.10); border-radius:22px; padding:30px 32px;
    box-shadow:0 24px 60px rgba(0,0,0,.4), 0 0 50px rgba(122,46,201,.2); position:relative; }
  .num { position:absolute; top:-26px; left:28px; width:52px; height:52px; border-radius:50%; background:#e90464;
    display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; }
  .head { display:flex; align-items:center; gap:16px; margin-top:8px; }
  .head svg { width:46px; height:46px; fill:#fff; flex:none; }
  .tool { font-family:"SF Mono",Menlo,monospace; font-size:40px; font-weight:700; color:#c3a3ff; font-variant-ligatures:none; }
  .repo { margin-top:10px; font-family:"SF Mono",Menlo,monospace; font-size:19px; color:#8f84a6; }
  .desc { margin-top:14px; font-size:25px; color:#c4b8d6; line-height:1.3; }
</style>
</head>

</body>
</html>
