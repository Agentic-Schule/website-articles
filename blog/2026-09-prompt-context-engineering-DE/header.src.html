<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(60% 55% at 74% 42%, rgba(217,119,87,0.30), transparent 60%),
      radial-gradient(50% 60% at 22% 95%, rgba(126,96,196,0.12), transparent 60%),
      linear-gradient(155deg,#221a16 0%,#160f0c 58%,#0d0908 100%);
    color:#fff; position:relative;
  }
  /* dezenter Punkt-Grid (gleiche DNA wie die Geschwister-Header) */
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:620px; }
  .kicker { font-size:20px; letter-spacing:6px; font-weight:700; color:#e0916f; text-transform:uppercase; }
  .kicker .dot { color:#d97757; }
  h1 { font-size:62px; line-height:1.06; font-weight:800; letter-spacing:-1.5px; margin:22px 0 0; }
  h1 .accent { color:#e58a68; }
  .sub { margin-top:24px; font-size:25px; font-weight:500; color:#c3b7ae; letter-spacing:-.2px; line-height:1.35; }
  .by { margin-top:38px; font-size:19px; color:#8c8079; }
  .by b { color:#cbbfb6; font-weight:600; }
  .art { position:absolute; right:34px; top:0; height:675px; width:520px; }
  /* offizielles Claude-Logo, via CSS-mask in Claude-Coral: der Agent liest deinen Prompt */
  .agent { position:absolute; left:383px; top:191px; width:34px; height:34px; background:#d97757;
    mask:url("claude.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 12px rgba(217,119,87,0.7)); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker">agentic<span class="dot">.</span>schule</div>
      <h1>Prompt &amp; Context<br><span class="accent">Engineering</span></h1>
      <div class="sub">Das Handwerk hinter den Buzzwords</div>
      <div class="by">von <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="520" height="675" viewBox="0 0 520 675" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e88a63" stop-opacity="0.45"/>
          <stop offset="55%" stop-color="#d97757" stop-opacity="0.13"/>
          <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Glow hinter der obersten Schicht -->
      <circle cx="260" cy="208" r="185" fill="url(#glow)"/>

      <!-- Schicht 1 (oben): Dein Prompt, hervorgehoben -->
      <rect x="85" y="170" width="350" height="76" rx="14" fill="#2a1c14" stroke="#d97757" stroke-width="2.6"/>
      <text x="115" y="217" font-size="24" font-weight="700" fill="#e58a68">&#10095; Dein Prompt</text>
      <rect x="292" y="194" width="13" height="28" fill="#d97757" opacity="0.85"/>

      <!-- Schicht 2: Skills und Slash-Befehle -->
      <g opacity="0.95">
        <rect x="85" y="262" width="350" height="76" rx="14" fill="#1d1713" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
        <text x="115" y="308" font-size="21" font-weight="600" fill="#a99c93">Skills &amp; Slash-Befehle</text>
      </g>

      <!-- Schicht 3: Custom Prompt -->
      <g opacity="0.8">
        <rect x="85" y="354" width="350" height="76" rx="14" fill="#1d1713" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
        <text x="115" y="400" font-size="21" font-weight="600" fill="#a99c93">Custom Prompt &#183; CLAUDE.md</text>
      </g>

      <!-- Schicht 4 (ganz unten): System Prompt -->
      <g opacity="0.6">
        <rect x="85" y="446" width="350" height="76" rx="14" fill="#1d1713" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
        <text x="115" y="492" font-size="21" font-weight="600" fill="#a99c93">System Prompt</text>
      </g>
    </svg>
    <div class="agent"></div>
  </div>
</body>
</html>
