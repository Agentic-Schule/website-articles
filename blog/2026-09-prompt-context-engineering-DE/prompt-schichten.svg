<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" width="900" height="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Der Prompt-Stapel: ganz unten der System Prompt, darauf der Custom Prompt, dann Skills und Slash-Befehle, ganz oben dein Prompt.">
  <!-- Schicht 4 (oben): Dein Prompt -->
  <rect x="190" y="20" width="520" height="60" rx="10" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-width="2.2"/>
  <text x="210" y="45" font-size="15" font-weight="700" fill="#d97757">Dein Prompt</text>
  <text x="210" y="66" font-size="12.5" fill="#8a8079">die Aufgabe, die du in den Chat tippst (das meinen die meisten)</text>

  <!-- Schicht 3: Skills und Slash-Befehle -->
  <rect x="190" y="92" width="520" height="60" rx="10" fill="none" stroke="#8a8079" stroke-width="1.8"/>
  <text x="210" y="117" font-size="15" font-weight="700" fill="#8a8079">Skills &amp; Slash-Befehle</text>
  <text x="210" y="138" font-size="12.5" fill="#8a8079">vorbereitete Anweisungen, bei Bedarf geladen</text>

  <!-- Schicht 2: Custom Prompt -->
  <rect x="190" y="164" width="520" height="60" rx="10" fill="none" stroke="#8a8079" stroke-width="1.8"/>
  <text x="210" y="189" font-size="15" font-weight="700" fill="#8a8079">Custom Prompt</text>
  <text x="210" y="210" font-size="12.5" fill="#8a8079">deine dauerhaften Projektregeln: CLAUDE.md, AGENTS.md &amp; Co.</text>

  <!-- Schicht 1 (ganz unten): System Prompt -->
  <rect x="190" y="236" width="520" height="60" rx="10" fill="none" stroke="#8a8079" stroke-width="1.8"/>
  <text x="210" y="261" font-size="15" font-weight="700" fill="#8a8079">System Prompt</text>
  <text x="210" y="282" font-size="12.5" fill="#8a8079">Grundregeln und Werkzeuge, vom Hersteller mitgeliefert</text>
</svg>
