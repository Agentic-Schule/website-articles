<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(60% 55% at 74% 42%, rgba(98,38,176,0.34), transparent 60%),
      radial-gradient(50% 60% at 22% 95%, rgba(233,4,100,0.16), transparent 60%),
      linear-gradient(155deg,#241a33 0%,#1b1525 58%,#0d0913 100%);
    color:#fff; position:relative;
  }
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .brand { position:absolute; top:60px; left:78px; height:56px; width:auto; z-index:2; }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:620px; }
  h1 { font-size:66px; line-height:1.05; font-weight:800; letter-spacing:-1.4px; margin:22px 0 0; }
  h1 .accent { background:linear-gradient(92deg,#a06bff 0%,#e90464 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:24px; font-size:26px; font-weight:500; color:#c4b8d6; letter-spacing:-.2px; }
  .by { margin-top:40px; font-size:19px; color:#8f84a6; }
  .by b { color:#cfc3e6; font-weight:600; }
  .art { position:absolute; right:44px; top:0; height:675px; width:520px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <img class="brand" src="logo-agentic-schule.png" alt="agentic.schule">
  <div class="wrap">
    <div class="left">
      <h1>Mac mini<br><span class="accent">Hardening</span></h1>
      <div class="sub">Encryption, Backups, Boot and Power</div>
      <div class="by">by <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="520" height="675" viewBox="0 0 520 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e90464" stop-opacity="0.42"/>
          <stop offset="55%" stop-color="#9a6cff" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#6226b0" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2c2140"/>
          <stop offset="100%" stop-color="#1a1327"/>
        </linearGradient>
        <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff3d86"/>
          <stop offset="100%" stop-color="#e90464"/>
        </linearGradient>
      </defs>

      <circle cx="260" cy="330" r="200" fill="url(#glow)"/>

      <path d="M260 150 L392 200 L392 356 C392 452 332 500 260 526 C188 500 128 452 128 356 L128 200 Z"
            fill="url(#shield)" stroke="#9a6cff" stroke-width="4"/>
      <path d="M260 150 L392 200 L392 356 C392 452 332 500 260 526 C188 500 128 452 128 356 L128 200 Z"
            fill="none" stroke="#b98cff" stroke-width="1.5" opacity="0.5" transform="scale(0.93) translate(19,24)"/>

      <circle cx="260" cy="322" r="34" fill="url(#key)"/>
      <path d="M248 346 L272 346 L282 408 L238 408 Z" fill="url(#key)"/>
      <circle cx="260" cy="322" r="34" fill="none" stroke="#ff8ab6" stroke-width="2" opacity="0.6"/>
    </svg>
  </div>
</body>
</html>
