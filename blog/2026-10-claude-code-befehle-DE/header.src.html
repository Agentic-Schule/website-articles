<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(60% 55% at 74% 42%, rgba(217,119,87,0.30), transparent 60%),
      radial-gradient(50% 60% at 22% 95%, rgba(126,96,196,0.12), transparent 60%),
      linear-gradient(155deg,#221a16 0%,#160f0c 58%,#0d0908 100%);
    color:#fff; position:relative;
  }
  /* dezenter Punkt-Grid (gleiche DNA wie die Geschwister-Header) */
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:600px; }
  .kicker { font-size:20px; letter-spacing:6px; font-weight:700; color:#e0916f; text-transform:uppercase; }
  .kicker .dot { color:#d97757; }
  h1 { font-size:66px; line-height:1.05; font-weight:800; letter-spacing:-1.5px; margin:22px 0 0; }
  h1 .accent { color:#e58a68; }
  .sub { margin-top:24px; font-size:25px; font-weight:500; color:#c3b7ae; letter-spacing:-.2px; line-height:1.35; }
  .by { margin-top:38px; font-size:19px; color:#8c8079; }
  .by b { color:#cbbfb6; font-weight:600; }
  .art { position:absolute; right:34px; top:0; height:675px; width:520px; }
  /* offizielles Claude-Logo, via CSS-mask in Claude-Coral: der Agent wartet auf den Befehl */
  .agent { position:absolute; left:424px; top:100px; width:30px; height:30px; background:#d97757;
    mask:url("claude.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 12px rgba(217,119,87,0.7)); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker">agentic<span class="dot">.</span>schule</div>
      <h1>10 Befehle<br><span class="accent">für Claude Code</span></h1>
      <div class="sub">Die du kennen solltest</div>
      <div class="by">von <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="520" height="675" viewBox="0 0 520 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e88a63" stop-opacity="0.42"/>
          <stop offset="55%" stop-color="#d97757" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Glow hinter der Palette -->
      <circle cx="260" cy="330" r="240" fill="url(#glow)"/>

      <!-- Die Befehlspalette -->
      <rect x="30" y="60" width="460" height="560" rx="18" fill="#1d1713" fill-opacity="0.92" stroke="rgba(255,255,255,0.16)" stroke-width="1.6"/>

      <!-- Eingabezeile mit Cursor -->
      <text x="58" y="123" font-size="24" font-weight="700" fill="#d97757" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/</text>
      <rect x="76" y="104" width="11" height="25" fill="#d97757" opacity="0.85"/>
      <line x1="46" y1="150" x2="474" y2="150" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/>

      <!-- Zeile 1, ausgewählt -->
      <rect x="46" y="170" width="428" height="40" rx="9" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-width="2"/>
      <text x="64" y="196" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#e58a68"><tspan font-weight="700">/</tspan>code-review</text>

      <text x="64" y="240" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#a99c93"><tspan fill="#d97757" font-weight="700">/</tspan>security-review</text>
      <text x="64" y="284" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#a99c93"><tspan fill="#d97757" font-weight="700">/</tspan>deep-research</text>
      <text x="64" y="328" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#a99c93"><tspan fill="#d97757" font-weight="700">/</tspan>loop</text>
      <text x="64" y="372" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#a99c93"><tspan fill="#d97757" font-weight="700">/</tspan>goal</text>
      <text x="64" y="416" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#a99c93"><tspan fill="#d97757" font-weight="700">/</tspan>simplify</text>
      <text x="64" y="460" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#a99c93"><tspan fill="#d97757" font-weight="700">/</tspan>model</text>
      <text x="64" y="504" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#a99c93"><tspan fill="#d97757" font-weight="700">/</tspan>effort</text>
      <text x="64" y="548" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#a99c93"><tspan fill="#d97757" font-weight="700">/</tspan>mcp</text>
      <text x="64" y="592" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#a99c93"><tspan fill="#d97757" font-weight="700">/</tspan>remote-control</text>
    </svg>
    <div class="agent"></div>
  </div>
</body>
</html>
