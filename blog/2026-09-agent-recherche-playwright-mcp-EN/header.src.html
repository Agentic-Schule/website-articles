<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(60% 55% at 74% 42%, rgba(217,119,87,0.30), transparent 60%),
      radial-gradient(50% 60% at 22% 95%, rgba(126,96,196,0.12), transparent 60%),
      linear-gradient(155deg,#221a16 0%,#160f0c 58%,#0d0908 100%);
    color:#fff; position:relative;
  }
  /* subtle dot grid (same DNA as the sibling headers) */
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:600px; }
  .kicker { font-size:20px; letter-spacing:6px; font-weight:700; color:#e0916f; text-transform:uppercase; }
  .kicker .dot { color:#d97757; }
  h1 { font-size:70px; line-height:1.04; font-weight:800; letter-spacing:-1.5px; margin:22px 0 0; }
  h1 .accent { color:#e58a68; }
  .sub { margin-top:24px; font-size:25px; font-weight:500; color:#c3b7ae; letter-spacing:-.2px; line-height:1.35; }
  .by { margin-top:38px; font-size:19px; color:#8c8079; }
  .by b { color:#cbbfb6; font-weight:600; }
  .art { position:absolute; right:34px; top:0; height:675px; width:520px; }
  /* official Claude logo, via CSS mask in Claude coral: the agent inside the browser window */
  .agent { position:absolute; left:424px; top:262px; width:30px; height:30px; background:#d97757;
    mask:url("claude.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 12px rgba(217,119,87,0.7)); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker">agentic<span class="dot">.</span>schule</div>
      <h1>Locked out?<br><span class="accent">Not anymore.</span></h1>
      <div class="sub">Your own Playwright MCP<br>for your agent's research</div>
      <div class="by">by <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="520" height="675" viewBox="0 0 520 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e88a63" stop-opacity="0.45"/>
          <stop offset="55%" stop-color="#d97757" stop-opacity="0.13"/>
          <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- glow behind the browser window -->
      <circle cx="290" cy="300" r="190" fill="url(#glow)"/>

      <!-- barrier: post, boom raised = clear passage -->
      <rect x="60" y="300" width="15" height="250" rx="4" fill="#3a322d"/>
      <rect x="54" y="288" width="27" height="16" rx="5" fill="#4a413b"/>
      <circle cx="67.5" cy="296" r="4" fill="#d97757" opacity="0.9"/>
      <g transform="rotate(-60 67.5 312)">
        <rect x="67" y="304" width="215" height="15" rx="6" fill="#4a413b"/>
        <rect x="88"  y="304" width="32" height="15" fill="#d97757" opacity="0.85"/>
        <rect x="152" y="304" width="32" height="15" fill="#d97757" opacity="0.85"/>
        <rect x="216" y="304" width="32" height="15" fill="#d97757" opacity="0.85"/>
      </g>

      <!-- browser window: driving through the open barrier -->
      <rect x="140" y="200" width="340" height="230" rx="14" fill="#1d1713" stroke="rgba(255,255,255,0.11)" stroke-width="1.5"/>
      <circle cx="164" cy="224" r="4.5" fill="rgba(255,255,255,0.18)"/>
      <circle cx="179" cy="224" r="4.5" fill="rgba(255,255,255,0.18)"/>
      <circle cx="194" cy="224" r="4.5" fill="rgba(255,255,255,0.18)"/>
      <rect x="214" y="217" width="238" height="14" rx="7" fill="rgba(255,255,255,0.07)"/>
      <line x1="140" y1="246" x2="480" y2="246" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

      <!-- line 1: the old giveaway, struck through -->
      <rect x="192" y="276" width="152" height="9" rx="4.5" fill="rgba(255,255,255,0.16)"/>
      <line x1="186" y1="280.5" x2="350" y2="280.5" stroke="#8c7f77" stroke-width="2"/>
      <!-- lines 2 and 3: the repairs, glowing -->
      <rect x="192" y="312" width="200" height="9" rx="4.5" fill="#d97757" opacity="0.9"/>
      <rect x="192" y="348" width="168" height="9" rx="4.5" fill="#d97757" opacity="0.55"/>
      <!-- line 4: normal content -->
      <rect x="192" y="384" width="120" height="9" rx="4.5" fill="rgba(255,255,255,0.14)"/>
      <rect x="324" y="383" width="8" height="11" fill="#d97757" opacity="0.9"/>

      <!-- checkmarks in front of the two repaired lines -->
      <path d="M168 313 l5 6 l9 -12" stroke="#d97757" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M168 349 l5 6 l9 -12" stroke="#d97757" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
    </svg>
    <div class="agent"></div>
  </div>
</body>
</html>
