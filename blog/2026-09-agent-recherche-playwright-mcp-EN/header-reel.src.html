<!doctype html>
<!--
  agentic.schule Reel-Banner (9:16), englische Video-Fassung.
  Buehne 1080x1920, Render 2160x3840 (deviceScaleFactor 2). Regeln: docs/banner.md
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(55% 26% at 76% 17%, rgba(98,38,176,0.36), transparent 60%),
      radial-gradient(62% 30% at 22% 86%, rgba(233,4,100,0.18), transparent 60%),
      linear-gradient(162deg,#241a33 0%,#1b1525 54%,#0d0913 100%);
    color:#fff; position:relative; text-align:center;
  }
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.6px, transparent 1.6px);
    background-size:40px 40px; mask-image:linear-gradient(160deg,#000,transparent 74%); }
  .logo { position:absolute; top:150px; left:50%; transform:translateX(-50%); height:70px; }
  .top { position:absolute; top:300px; left:0; right:0; padding:0 96px; }
  .kicker { font-size:26px; letter-spacing:7px; font-weight:700; color:#b99ae8; text-transform:uppercase; }
  h1 { font-size:78px; line-height:1.04; font-weight:800; letter-spacing:-1.6px; margin-top:28px; }
  h1 .accent { background:linear-gradient(92deg,#a06bff 0%,#e90464 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:28px; font-size:35px; font-weight:500; color:#c4b8d6; }
  .video { position:absolute; top:656px; left:0; width:1080px; height:608px; background:rgba(0,0,0,0.30); }
  .edge { position:absolute; left:0; width:1080px; height:4px;
    background:linear-gradient(90deg, transparent, #a06bff 22%, #e90464 78%, transparent); opacity:.85; }
  .edge.t { top:646px; } .edge.b { top:1266px; }
  .bottom { position:absolute; top:1360px; left:0; right:0; padding:0 96px; }
  .teaser { font-size:46px; font-weight:700; color:#f2ecff; line-height:1.18; max-width:780px; margin:0 auto; }
</style>
</head>
<body>
  <div class="grid"></div>
  <img class="logo" src="logo-agentic-schule.png" alt="agentic.schule">
  <div class="top">
    <div class="kicker">Day 8/30</div>
    <h1>Locked out?<br><span class="accent">Not anymore.</span></h1>
    <div class="sub">Your own Playwright MCP<br>for your agent’s research</div>
  </div>
  <div class="edge t"></div>
  <div class="video"></div>
  <div class="edge b"></div>
  <div class="bottom">
    <div class="teaser">Blocked from research? Give your agent its own browser.</div>
  </div>
</body>
</html>
