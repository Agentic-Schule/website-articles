<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(60% 55% at 74% 42%, rgba(98,38,176,0.34), transparent 60%),
      radial-gradient(50% 60% at 22% 95%, rgba(233,4,100,0.16), transparent 60%),
      linear-gradient(155deg,#241a33 0%,#1b1525 58%,#0d0913 100%);
    color:#fff; position:relative;
  }
  /* dezenter Punkt-Grid (gleiche DNA wie die anderen Header der Serie) */
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:620px; }
  .brand { position:absolute; top:60px; left:78px; height:56px; width:auto; z-index:2; }
  h1 { font-size:60px; line-height:1.06; font-weight:800; letter-spacing:-1.2px; margin:22px 0 0; }
  h1 .accent { background:linear-gradient(92deg,#a06bff 0%,#e90464 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:24px; font-size:27px; font-weight:500; color:#c4b8d6; letter-spacing:-.2px; }
  .by { margin-top:40px; font-size:19px; color:#8f84a6; }
  .by b { color:#cfc3e6; font-weight:600; }
  .art { position:absolute; right:44px; top:0; height:675px; width:520px; }
  /* Claude-Logo als CSS-mask: der Agent, der die Anweisung entgegennimmt */
  .agent { position:absolute; left:222px; top:132px; width:76px; height:76px; background:#e90464;
    mask:url("claude.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 18px rgba(122,46,201,0.60)); }
</style>
</head>
<body>
  <div class="grid"></div>
  <img class="brand" src="logo-agentic-schule.png" alt="agentic.schule">
  <div class="wrap">
    <div class="left">
      <h1>Analyse eines<br><span class="accent">böswilligen Skills</span></h1>
      <div class="sub">Ein Angriff, der bis heute aktiv ist</div>
      <div class="by">von <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="520" height="675" viewBox="0 0 520 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#9a6cff" stop-opacity="0.45"/>
          <stop offset="55%" stop-color="#6226b0" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#6226b0" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="wire" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c3a3ff"/>
          <stop offset="100%" stop-color="#7a2ec9"/>
        </linearGradient>
        <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e90464"/>
          <stop offset="100%" stop-color="#a80248"/>
        </linearGradient>
      </defs>

      <circle cx="260" cy="170" r="150" fill="url(#glow)"/>

      <!-- Skill-Dokument oben: sieht harmlos aus -->
      <rect x="150" y="72" width="220" height="196" rx="14" fill="#211830" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <rect x="176" y="228" width="120" height="8" rx="4" fill="rgba(255,255,255,0.16)"/>
      <rect x="176" y="246" width="86" height="8" rx="4" fill="rgba(255,255,255,0.10)"/>

      <!-- Leitung vom Skill zum externen Ziel -->
      <path d="M260 268 L260 372" stroke="#b98cff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 9"/>
      <circle cx="260" cy="268" r="6" fill="#9a6cff"/>
      <circle cx="260" cy="372" r="6" fill="#e90464"/>

      <!-- externer Server: der Inhalt, der sich austauschen laesst -->
      <rect x="140" y="374" width="240" height="104" rx="12" fill="#211830" stroke="rgba(233,4,100,0.55)" stroke-width="2"/>
      <circle cx="166" cy="398" r="4" fill="rgba(255,255,255,0.20)"/>
      <circle cx="180" cy="398" r="4" fill="rgba(255,255,255,0.20)"/>
      <rect x="164" y="420" width="130" height="8" rx="4" fill="rgba(233,4,100,0.75)"/>
      <rect x="164" y="438" width="192" height="8" rx="4" fill="rgba(255,255,255,0.14)"/>
      <rect x="164" y="456" width="104" height="8" rx="4" fill="rgba(255,255,255,0.10)"/>

      <!-- Austausch-Symbol: zwei Pfeile, der Inhalt kippt -->
      <g transform="translate(398 396)">
        <circle cx="26" cy="26" r="26" fill="url(#danger)" opacity="0.92"/>
        <path d="M14 20 h20 l-6 -6 M38 32 h-20 l6 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>

      <!-- Weg zurueck in den Rechner des Nutzers -->
      <path d="M260 478 L260 556" stroke="#e90464" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 9"/>
      <circle cx="260" cy="478" r="6" fill="#e90464"/>
      <rect x="176" y="558" width="168" height="70" rx="10" fill="#211830" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <rect x="200" y="580" width="120" height="8" rx="4" fill="rgba(255,255,255,0.16)"/>
      <rect x="200" y="598" width="84" height="8" rx="4" fill="rgba(255,255,255,0.10)"/>
    </svg>
    <div class="agent"></div>
  </div>
</body>
</html>
