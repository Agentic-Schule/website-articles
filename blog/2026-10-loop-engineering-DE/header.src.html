<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(60% 55% at 74% 42%, rgba(98,38,176,0.34), transparent 60%),
      radial-gradient(50% 60% at 22% 95%, rgba(233,4,100,0.16), transparent 60%),
      linear-gradient(155deg,#241a33 0%,#1b1525 58%,#0d0913 100%);
    color:#fff; position:relative;
  }
  /* dezenter Punkt-Grid (gleiche DNA wie die anderen Header der Serie) */
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:620px; }
  .brand { position:absolute; top:60px; left:78px; height:56px; width:auto; z-index:2; }
  h1 { font-size:60px; line-height:1.06; font-weight:800; letter-spacing:-1.2px; margin:22px 0 0; }
  h1 .accent { background:linear-gradient(92deg,#a06bff 0%,#e90464 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:24px; font-size:27px; font-weight:500; color:#c4b8d6; letter-spacing:-.2px; }
  .by { margin-top:40px; font-size:19px; color:#8f84a6; }
  .by b { color:#cfc3e6; font-weight:600; }
  .art { position:absolute; right:44px; top:0; height:675px; width:520px; }
  /* Claude-Logo als CSS-mask: der Agent, der in der Schleife arbeitet */
  .agent { position:absolute; left:222px; top:290px; width:82px; height:82px; background:#e90464;
    mask:url("claude.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 22px rgba(122,46,201,0.60)); }
</style>
</head>
<body>
  <div class="grid"></div>
  <img class="brand" src="logo-agentic-schule.png" alt="agentic.schule">
  <div class="wrap">
    <div class="left">
      <h1>Loop<br><span class="accent">Engineering</span></h1>
      <div class="sub">Was /loop und /goal wirklich tun</div>
      <div class="by">von <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="520" height="675" viewBox="0 0 520 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#9a6cff" stop-opacity="0.40"/>
          <stop offset="55%" stop-color="#e90464" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#e90464" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#c3a3ff"/>
          <stop offset="100%" stop-color="#a80248"/>
        </linearGradient>
        <linearGradient id="done" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8fbf7a"/>
          <stop offset="100%" stop-color="#5c9247"/>
        </linearGradient>
      </defs>

      <circle cx="262" cy="330" r="176" fill="url(#glow)"/>

      <!-- die Schleife selbst: gestrichelter Ring, oben offen fuer den Pfeil -->
      <circle cx="262" cy="330" r="132" stroke="url(#ring)" stroke-width="4"
              stroke-linecap="round" stroke-dasharray="15 13" fill="none" opacity="0.95"/>

      <!-- Iterationsmarken auf dem Ring -->
      <circle cx="394" cy="330" r="7" fill="#b98cff"/>
      <circle cx="262" cy="462" r="7" fill="#b98cff" opacity="0.75"/>
      <circle cx="130" cy="330" r="7" fill="#b98cff" opacity="0.5"/>

      <!-- Pfeilspitze oben: die Richtung, in die es weitergeht -->
      <path d="M250 186 l24 12 -24 12 z" fill="#c3a3ff"/>

      <!-- Austritt aus der Schleife, wenn die Bedingung haelt -->
      <path d="M382 424 C 424 470, 436 508, 438 548" stroke="#8fbf7a" stroke-width="3.5"
            stroke-linecap="round" stroke-dasharray="9 9" fill="none" opacity="0.9"/>
      <g transform="translate(410 556)">
        <circle cx="28" cy="28" r="28" fill="url(#done)" opacity="0.95"/>
        <path d="M16 29 l8 8 16 -18" stroke="#12240c" stroke-width="4.5"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>

      <!-- Bedingung als kleine Karte am Ring -->
      <rect x="96" y="556" width="212" height="58" rx="12" fill="#211830"
            stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <rect x="118" y="574" width="120" height="8" rx="4" fill="rgba(255,255,255,0.20)"/>
      <rect x="118" y="590" width="76" height="8" rx="4" fill="rgba(255,255,255,0.11)"/>
    </svg>
    <div class="agent"></div>
  </div>
</body>
</html>
