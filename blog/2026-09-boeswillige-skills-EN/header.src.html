<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(60% 55% at 74% 42%, rgba(217,119,87,0.30), transparent 60%),
      radial-gradient(50% 60% at 22% 95%, rgba(126,96,196,0.12), transparent 60%),
      linear-gradient(155deg,#221a16 0%,#160f0c 58%,#0d0908 100%);
    color:#fff; position:relative;
  }
  /* dezenter Punkt-Grid (gleiche DNA wie die anderen Header der Serie) */
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:620px; }
  .kicker { font-size:20px; letter-spacing:6px; font-weight:700; color:#e0916f; text-transform:uppercase; }
  .kicker .dot { color:#d97757; }
  h1 { font-size:60px; line-height:1.06; font-weight:800; letter-spacing:-1.2px; margin:22px 0 0; }
  h1 .accent { color:#e58a68; }
  .sub { margin-top:24px; font-size:27px; font-weight:500; color:#c3b7ae; letter-spacing:-.2px; }
  .by { margin-top:40px; font-size:19px; color:#8c8079; }
  .by b { color:#cbbfb6; font-weight:600; }
  .art { position:absolute; right:44px; top:0; height:675px; width:520px; }
  /* Claude-Logo als CSS-mask: der Agent, der die Anweisung entgegennimmt */
  .agent { position:absolute; left:222px; top:132px; width:76px; height:76px; background:#d97757;
    mask:url("claude.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 18px rgba(217,119,87,0.55)); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker">agentic<span class="dot">.</span>schule</div>
      <h1>Anatomy of a<br><span class="accent">Malicious Skill</span></h1>
      <div class="sub">An attack that is still live</div>
      <div class="by">by <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="520" height="675" viewBox="0 0 520 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e88a63" stop-opacity="0.45"/>
          <stop offset="55%" stop-color="#d97757" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="wire" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f2b79f"/>
          <stop offset="100%" stop-color="#d97757"/>
        </linearGradient>
        <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e05c4a"/>
          <stop offset="100%" stop-color="#b8392c"/>
        </linearGradient>
      </defs>

      <circle cx="260" cy="170" r="150" fill="url(#glow)"/>

      <!-- Skill-Dokument oben: sieht harmlos aus -->
      <rect x="150" y="72" width="220" height="196" rx="14" fill="#1d1713" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <rect x="176" y="228" width="120" height="8" rx="4" fill="rgba(255,255,255,0.16)"/>
      <rect x="176" y="246" width="86" height="8" rx="4" fill="rgba(255,255,255,0.10)"/>

      <!-- Leitung vom Skill zum externen Ziel -->
      <path d="M260 268 L260 372" stroke="#e0916f" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 9"/>
      <circle cx="260" cy="268" r="6" fill="#d97757"/>
      <circle cx="260" cy="372" r="6" fill="#e05c4a"/>

      <!-- externer Server: der Inhalt, der sich austauschen laesst -->
      <rect x="140" y="374" width="240" height="104" rx="12" fill="#1d1713" stroke="rgba(224,92,74,0.55)" stroke-width="2"/>
      <circle cx="166" cy="398" r="4" fill="rgba(255,255,255,0.20)"/>
      <circle cx="180" cy="398" r="4" fill="rgba(255,255,255,0.20)"/>
      <rect x="164" y="420" width="130" height="8" rx="4" fill="rgba(224,92,74,0.75)"/>
      <rect x="164" y="438" width="192" height="8" rx="4" fill="rgba(255,255,255,0.14)"/>
      <rect x="164" y="456" width="104" height="8" rx="4" fill="rgba(255,255,255,0.10)"/>

      <!-- Austausch-Symbol: zwei Pfeile, der Inhalt kippt -->
      <g transform="translate(398 396)">
        <circle cx="26" cy="26" r="26" fill="url(#danger)" opacity="0.92"/>
        <path d="M14 20 h20 l-6 -6 M38 32 h-20 l6 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>

      <!-- Weg zurueck in den Rechner des Nutzers -->
      <path d="M260 478 L260 556" stroke="#e05c4a" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 9"/>
      <circle cx="260" cy="478" r="6" fill="#e05c4a"/>
      <rect x="176" y="558" width="168" height="70" rx="10" fill="#1d1713" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <rect x="200" y="580" width="120" height="8" rx="4" fill="rgba(255,255,255,0.16)"/>
      <rect x="200" y="598" width="84" height="8" rx="4" fill="rgba(255,255,255,0.10)"/>
    </svg>
    <div class="agent"></div>
  </div>
</body>
</html>
