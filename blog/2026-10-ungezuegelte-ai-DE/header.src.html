<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(58% 55% at 76% 44%, rgba(217,119,87,0.28), transparent 60%),
      radial-gradient(50% 60% at 18% 92%, rgba(126,96,196,0.12), transparent 60%),
      linear-gradient(155deg,#221a16 0%,#160f0c 58%,#0d0908 100%);
    color:#fff; position:relative;
  }
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:560px; }
  .kicker { font-size:20px; letter-spacing:6px; font-weight:700; color:#e0916f; text-transform:uppercase; }
  .kicker .dot { color:#d97757; }
  h1 { font-size:64px; line-height:1.04; font-weight:800; letter-spacing:-1.5px; margin:22px 0 0; }
  h1 .accent { color:#e58a68; }
  .sub { margin-top:24px; font-size:24px; font-weight:500; color:#c3b7ae; letter-spacing:-.2px; line-height:1.35; }
  .by { margin-top:36px; font-size:19px; color:#8c8079; }
  .by b { color:#cbbfb6; font-weight:600; }
  .art { position:absolute; right:24px; top:0; height:675px; width:540px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker">agentic<span class="dot">.</span>schule</div>
      <h1>Ungezügelte<br><span class="accent">KI</span></h1>
      <div class="sub">Ein offenes Modell auf<br>der eigenen Maschine</div>
      <div class="by">von <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="540" height="675" viewBox="0 0 540 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="72%" cy="40%" r="46%">
          <stop offset="0%" stop-color="#e88a63" stop-opacity="0.42"/>
          <stop offset="60%" stop-color="#d97757" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <circle cx="380" cy="300" r="180" fill="url(#glow)"/>

      <!-- Anker links: die Cloud-Schranke, an der die Kette haengt -->
      <rect x="20" y="360" width="26" height="90" rx="6" fill="#8c7f77"/>

      <!-- angekettete Glieder (gedaempft), enden an der Bruchstelle -->
      <rect x="44" y="382" width="96" height="46" rx="23" fill="none" stroke="#8c7f77" stroke-width="11"/>
      <rect x="116" y="382" width="96" height="46" rx="23" fill="none" stroke="#8c7f77" stroke-width="11"/>

      <!-- Bruchstelle: klarer Spalt mit Funken -->
      <g stroke="#e58a68" stroke-width="3" stroke-linecap="round">
        <path d="M232 380 L246 360"/>
        <path d="M240 405 L262 402"/>
        <path d="M232 430 L246 450"/>
      </g>

      <!-- freie Glieder (koralle, driften nach oben rechts, mit Glow) -->
      <rect x="286" y="330" width="104" height="50" rx="25" fill="none" stroke="#e58a68" stroke-width="11" transform="rotate(-15 338 355)"/>
      <rect x="366" y="262" width="104" height="50" rx="25" fill="none" stroke="#e58a68" stroke-width="11" transform="rotate(-27 418 287)"/>
    </svg>
  </div>
</body>
</html>
