<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(60% 55% at 74% 42%, rgba(217,119,87,0.30), transparent 60%),
      radial-gradient(50% 60% at 22% 95%, rgba(126,96,196,0.12), transparent 60%),
      linear-gradient(155deg,#221a16 0%,#160f0c 58%,#0d0908 100%);
    color:#fff; position:relative;
  }
  /* dezenter Punkt-Grid (gleiche DNA wie die Geschwister-Header) */
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:620px; }
  .kicker { font-size:20px; letter-spacing:6px; font-weight:700; color:#e0916f; text-transform:uppercase; }
  .kicker .dot { color:#d97757; }
  h1 { font-size:70px; line-height:1.04; font-weight:800; letter-spacing:-1.5px; margin:22px 0 0; }
  h1 .accent { color:#e58a68; }
  .sub { margin-top:24px; font-size:25px; font-weight:500; color:#c3b7ae; letter-spacing:-.2px; line-height:1.35; }
  .by { margin-top:38px; font-size:19px; color:#8c8079; }
  .by b { color:#cbbfb6; font-weight:600; }
  .art { position:absolute; right:34px; top:0; height:675px; width:520px; }
  /* offizielles Claude-Logo, via CSS-mask in Claude-Coral: die KI ist der Würfelwurf */
  .agent { position:absolute; left:233px; top:268px; width:64px; height:64px; background:#d97757;
    mask:url("claude.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 14px rgba(217,119,87,0.7)); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker">agentic<span class="dot">.</span>schule</div>
      <h1>Vibe<br><span class="accent">Coding?</span></h1>
      <div class="sub">Oder doch gutes Handwerk?</div>
      <div class="by">von <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="520" height="675" viewBox="0 0 520 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e88a63" stop-opacity="0.45"/>
          <stop offset="55%" stop-color="#d97757" stop-opacity="0.13"/>
          <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Glow hinter dem Hero-Würfel -->
      <circle cx="265" cy="300" r="195" fill="url(#glow)"/>

      <!-- Wurf-Spur: zwei dezente Bögen -->
      <path d="M60 560 Q 150 500 190 420" stroke="#8c7f77" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 8" fill="none"/>
      <path d="M120 600 Q 210 545 250 470" stroke="#8c7f77" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 8" fill="none"/>

      <!-- Würfel 3 (klein, hinten, gedimmt): drei Augen -->
      <g transform="translate(398,150) rotate(-24)" opacity="0.55">
        <rect x="-45" y="-45" width="90" height="90" rx="16" fill="#1d1713" stroke="#8c7f77" stroke-width="1.8"/>
        <circle cx="-21" cy="-21" r="7.5" fill="#8c7f77"/>
        <circle cx="0" cy="0" r="7.5" fill="#8c7f77"/>
        <circle cx="21" cy="21" r="7.5" fill="#8c7f77"/>
      </g>

      <!-- Würfel 2 (mittel, unten links): fünf Augen -->
      <g transform="translate(152,478) rotate(18)" opacity="0.85">
        <rect x="-55" y="-55" width="110" height="110" rx="20" fill="#1d1713" stroke="#8c7f77" stroke-width="2"/>
        <circle cx="-27" cy="-27" r="9" fill="#8c7f77"/>
        <circle cx="27" cy="-27" r="9" fill="#8c7f77"/>
        <circle cx="0" cy="0" r="9" fill="#8c7f77"/>
        <circle cx="-27" cy="27" r="9" fill="#8c7f77"/>
        <circle cx="27" cy="27" r="9" fill="#8c7f77"/>
      </g>

      <!-- Hero-Würfel (Koralle): statt Augen das Claude-Logo -->
      <g transform="translate(265,300) rotate(-12)">
        <rect x="-78" y="-78" width="156" height="156" rx="26" fill="#2a1c14" stroke="#d97757" stroke-width="2.8"/>
      </g>
    </svg>
    <div class="agent"></div>
  </div>
</body>
</html>
