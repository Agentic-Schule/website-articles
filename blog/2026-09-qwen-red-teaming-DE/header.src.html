<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(58% 55% at 74% 46%, rgba(217,119,87,0.26), transparent 60%),
      radial-gradient(50% 60% at 18% 92%, rgba(126,96,196,0.12), transparent 60%),
      linear-gradient(155deg,#221a16 0%,#160f0c 58%,#0d0908 100%);
    color:#fff; position:relative;
  }
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:600px; }
  .kicker { font-size:20px; letter-spacing:6px; font-weight:700; color:#e0916f; text-transform:uppercase; }
  .kicker .dot { color:#d97757; }
  h1 { font-size:62px; line-height:1.04; font-weight:800; letter-spacing:-1.5px; margin:22px 0 0; }
  h1 .accent { color:#e58a68; }
  .sub { margin-top:24px; font-size:24px; font-weight:500; color:#c3b7ae; letter-spacing:-.2px; line-height:1.35; }
  .by { margin-top:36px; font-size:19px; color:#8c8079; }
  .by b { color:#cbbfb6; font-weight:600; }
  .art { position:absolute; right:30px; top:0; height:675px; width:520px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker">agentic<span class="dot">.</span>schule</div>
      <h1>The Asymmetry<br><span class="accent">Problem</span></h1>
      <div class="sub">Wenn nur die Angreifer<br>freie KI-Werkzeuge haben</div>
      <div class="by">von <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="520" height="675" viewBox="0 0 520 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#e88a63" stop-opacity="0.34"/>
          <stop offset="60%" stop-color="#d97757" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <circle cx="270" cy="330" r="205" fill="url(#glow)"/>

      <!-- Standfuss + Saeule + Drehpunkt -->
      <rect x="220" y="486" width="100" height="10" rx="5" fill="#8c7f77"/>
      <rect x="264" y="336" width="12" height="152" rx="6" fill="#8c7f77"/>
      <circle cx="270" cy="330" r="9" fill="#cbbfb6"/>

      <!-- Balken, gekippt: links (Angreifer) hoch, rechts (Verteidiger) tief -->
      <line x1="140" y1="292" x2="400" y2="368" stroke="#e58a68" stroke-width="6" stroke-linecap="round"/>

      <!-- linke Schale: Angreifer, oben, leicht und frei -->
      <line x1="140" y1="292" x2="112" y2="372" stroke="#8c7f77" stroke-width="1.8"/>
      <line x1="140" y1="292" x2="168" y2="372" stroke="#8c7f77" stroke-width="1.8"/>
      <path d="M104 372 Q140 402 176 372" fill="none" stroke="#d97757" stroke-width="2.6"/>
      <!-- offenes Schloss / frei -->
      <circle cx="140" cy="352" r="10" fill="none" stroke="#d97757" stroke-width="2.4"/>
      <path d="M140 352 m0 -10 a10 10 0 0 1 10 10" fill="none" stroke="#d97757" stroke-width="2.4" opacity="0.9"/>
      <text x="140" y="430" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e0916f">Angreifer</text>
      <text x="140" y="451" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#8c8079">frei, ohne Limit</text>

      <!-- rechte Schale: Verteidiger, unten, von Regeln beschwert -->
      <line x1="400" y1="368" x2="372" y2="452" stroke="#8c7f77" stroke-width="1.8"/>
      <line x1="400" y1="368" x2="428" y2="452" stroke="#8c7f77" stroke-width="1.8"/>
      <path d="M364 452 Q400 482 436 452" fill="none" stroke="#8c7f77" stroke-width="2.6"/>
      <!-- Gewichte = Regeln, Guardrails, Limits -->
      <rect x="378" y="428" width="44" height="9" rx="2" fill="#8c7f77"/>
      <rect x="384" y="416" width="32" height="9" rx="2" fill="#8c7f77" opacity="0.8"/>
      <rect x="389" y="404" width="22" height="9" rx="2" fill="#8c7f77" opacity="0.6"/>
      <text x="400" y="512" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#cbbfb6">Verteidiger</text>
      <text x="400" y="533" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#8c8079">Regeln, Limits, Aufsicht</text>
    </svg>
  </div>
</body>
</html>
