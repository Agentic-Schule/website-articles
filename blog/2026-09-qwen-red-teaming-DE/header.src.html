<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(58% 55% at 76% 46%, rgba(217,119,87,0.28), transparent 60%),
      radial-gradient(50% 60% at 18% 92%, rgba(126,96,196,0.12), transparent 60%),
      linear-gradient(155deg,#221a16 0%,#160f0c 58%,#0d0908 100%);
    color:#fff; position:relative;
  }
  /* dezenter Punkt-Grid (gleiche DNA wie die Geschwister-Header) */
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:600px; }
  .kicker { font-size:20px; letter-spacing:6px; font-weight:700; color:#e0916f; text-transform:uppercase; }
  .kicker .dot { color:#d97757; }
  h1 { font-size:62px; line-height:1.04; font-weight:800; letter-spacing:-1.5px; margin:22px 0 0; }
  h1 .accent { color:#e58a68; }
  .sub { margin-top:24px; font-size:24px; font-weight:500; color:#c3b7ae; letter-spacing:-.2px; line-height:1.35; }
  .by { margin-top:36px; font-size:19px; color:#8c8079; }
  .by b { color:#cbbfb6; font-weight:600; }
  .art { position:absolute; right:26px; top:0; height:675px; width:540px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker">agentic<span class="dot">.</span>schule</div>
      <h1>The Asymmetry<br><span class="accent">Problem</span></h1>
      <div class="sub">Wenn nur die Angreifer<br>freie Werkzeuge haben</div>
      <div class="by">von <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="540" height="675" viewBox="0 0 540 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e88a63" stop-opacity="0.38"/>
          <stop offset="60%" stop-color="#d97757" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
        </radialGradient>
        <marker id="a-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#d97757"/>
        </marker>
        <marker id="a-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#8c7f77"/>
        </marker>
      </defs>

      <circle cx="180" cy="338" r="150" fill="url(#glow)"/>

      <!-- der gemeinsame Kern: dasselbe Modell fuer beide Seiten -->
      <circle cx="180" cy="338" r="52" fill="#1d1713" stroke="#d97757" stroke-width="2.2"/>
      <text x="180" y="332" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e0916f">dasselbe</text>
      <text x="180" y="352" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e0916f">Modell</text>

      <!-- obere Spur: Angreifer, freie Bahn durch das offene Tor -->
      <path d="M232 300 C 300 250, 360 232, 430 232" stroke="#d97757" stroke-width="2.6" fill="none" marker-end="url(#a-coral)"/>
      <!-- offenes Tor (zwei Pfosten, kein Riegel) -->
      <rect x="356" y="206" width="4" height="52" rx="2" fill="#d97757"/>
      <rect x="392" y="206" width="4" height="52" rx="2" fill="#d97757"/>
      <text x="250" y="214" text-anchor="start" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#cbbfb6">Angreifer</text>
      <text x="250" y="236" text-anchor="start" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#8c8079">keine Regeln</text>

      <!-- untere Spur: Verteidiger, prallt an der geschlossenen Schranke ab -->
      <path d="M232 376 C 300 426, 350 444, 402 444" stroke="#8c7f77" stroke-width="2.4" fill="none" marker-end="url(#a-mute)"/>
      <!-- geschlossene Schranke -->
      <rect x="410" y="404" width="6" height="80" rx="3" fill="#d97757"/>
      <rect x="416" y="418" width="70" height="10" rx="5" fill="#d97757" transform="rotate(12 416 423)"/>
      <g stroke="#d97757" stroke-width="3.4" stroke-linecap="round">
        <path d="M436 448 L452 470"/>
        <path d="M452 448 L436 470"/>
      </g>
      <text x="250" y="470" text-anchor="start" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#cbbfb6">Verteidiger</text>
      <text x="250" y="492" text-anchor="start" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#8c8079">an die Regeln gebunden</text>
    </svg>
  </div>
</body>
</html>
