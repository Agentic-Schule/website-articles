<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:
      radial-gradient(60% 55% at 74% 42%, rgba(98,38,176,0.34), transparent 60%),
      radial-gradient(50% 60% at 22% 95%, rgba(233,4,100,0.16), transparent 60%),
      linear-gradient(155deg,#241a33 0%,#1b1525 58%,#0d0913 100%);
    color:#fff; position:relative;
  }
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:34px 34px; mask-image:linear-gradient(120deg,#000,transparent 70%); }
  .wrap { position:absolute; inset:0; display:flex; align-items:center; padding:0 78px; }
  .left { width:600px; }
  .brand { position:absolute; top:60px; left:78px; height:56px; width:auto; z-index:2; }
  h1 { font-size:74px; line-height:1.02; font-weight:800; letter-spacing:-1.5px; margin:22px 0 0; }
  h1 .accent { background:linear-gradient(92deg,#a06bff 0%,#e90464 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:24px; font-size:27px; font-weight:500; color:#c4b8d6; letter-spacing:-.2px; }
  .by { margin-top:40px; font-size:19px; color:#8f84a6; }
  .by b { color:#cfc3e6; font-weight:600; }
  .art { position:absolute; right:44px; top:0; height:675px; width:520px; }
  .logo { position:absolute; left:262px; top:92px; width:76px; height:76px;
    background:#e90464;
    -webkit-mask:url("claude.svg") center/contain no-repeat;
    mask:url("claude.svg") center/contain no-repeat;
    filter:drop-shadow(0 0 22px rgba(122,46,201,0.6)); }
  .tag { position:absolute; font-size:22px; font-weight:700; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <img class="brand" src="logo-agentic-schule.png" alt="agentic.schule">
  <div class="wrap">
    <div class="left">
      <h1>Agentic&nbsp;Coding<br><span class="accent">Around the Clock</span></h1>
      <div class="sub">Maxing Out Multiple Claude Max Plans<br>Without Interruption</div>
      <div class="by">by <b>Johannes Hoppe</b></div>
    </div>
  </div>

  <div class="art">
    <svg width="520" height="675" viewBox="0 0 520 675" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#9a6cff" stop-opacity="0.5"/>
          <stop offset="55%" stop-color="#e90464" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#e90464" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="fuelFull" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b98cff"/>
          <stop offset="100%" stop-color="#6226B0"/>
        </linearGradient>
        <linearGradient id="fuelLow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9a6cff" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#6226B0" stop-opacity="0.7"/>
        </linearGradient>
        <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#c3a3ff"/>
          <stop offset="100%" stop-color="#e90464"/>
        </linearGradient>
        <marker id="head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0 0 L10 5 L0 10 z" fill="#e90464"/>
        </marker>
      </defs>

      <!-- Orbit (Ground Control), as in part 1 -->
      <g transform="rotate(-20 260 330)" opacity="0.45">
        <ellipse cx="260" cy="330" rx="236" ry="118" stroke="#8f84a6" stroke-width="1.5" stroke-dasharray="2 9" fill="none"/>
        <circle cx="496" cy="330" r="4.5" fill="#b98cff"/>
      </g>

      <circle cx="300" cy="130" r="110" fill="url(#glow)"/>

      <!-- Line from Claude to both tanks -->
      <path d="M300 184 L300 214 M150 214 L450 214 M150 214 L150 250 M300 214 L300 250 M450 214 L450 250" stroke="#8f84a6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

      <!-- Tank 1: almost empty / fast leer -->
      <rect x="106" y="250" width="88" height="250" rx="24" fill="#211830" stroke="#7a2ec9" stroke-width="3"/>
      <clipPath id="t1"><rect x="109" y="253" width="82" height="244" rx="21"/></clipPath>
      <rect x="109" y="455" width="82" height="42" fill="url(#fuelLow)" clip-path="url(#t1)"/>

      <!-- Tank 2: full, active / voll, aktiv -->
      <rect x="256" y="250" width="88" height="250" rx="24" fill="#211830" stroke="#b98cff" stroke-width="3"/>
      <clipPath id="t2"><rect x="259" y="253" width="82" height="244" rx="21"/></clipPath>
      <rect x="259" y="290" width="82" height="207" fill="url(#fuelFull)" clip-path="url(#t2)"/>

      <!-- Tank 3: full, standby / voll, in Reserve -->
      <rect x="406" y="250" width="88" height="250" rx="24" fill="#211830" stroke="#7a2ec9" stroke-width="3"/>
      <clipPath id="t3"><rect x="409" y="253" width="82" height="244" rx="21"/></clipPath>
      <rect x="409" y="290" width="82" height="207" fill="url(#fuelLow)" clip-path="url(#t3)"/>

      <!-- The switch / Der Wechsel -->
      <path d="M154 572 C 185 640, 265 640, 294 580" stroke="url(#flow)" stroke-width="6" stroke-linecap="round" fill="none" marker-end="url(#head)"/>
    </svg>
    <div class="logo"></div>
    <div class="tag" style="left:144px; top:516px; color:#8f84a6;">1</div>
    <div class="tag" style="left:294px; top:516px; color:#e0cfff;">2</div>
    <div class="tag" style="left:444px; top:516px; color:#8f84a6;">3</div>
  </div>
</body>
</html>
