<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><style>
html,body{width:1080px;height:960px}
h1{position:absolute;left:70px;right:70px;top:120px;font-size:76px}
.mono{font-family:"SF Mono",Menlo,monospace;font-variant-ligatures:none}
.card{background:#211830;border:1.5px solid rgba(255,255,255,.1);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.term{position:absolute;left:60px;right:60px;overflow:hidden}
.bar{height:56px;background:#2a1f3b;display:flex;align-items:center;gap:12px;padding:0 24px}.bar i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.code{padding:26px 34px;font-size:30px;line-height:1.6;color:#c4b8d6;white-space:nowrap}.p{color:#e90464}.f{color:#c3a3ff;font-weight:700}.g{color:#8f84a6}
.stage{position:absolute;inset:0;transform:translateY(200px) scale(.8);transform-origin:50% 0}</style></head><body><div class="grid"></div><div class="stage"><style>.c{position:absolute;inset:0;display:flex;align-items:center;padding:0 70px}.c h1{position:static;font-size:96px;letter-spacing:-2.5px;line-height:1.02}</style>
<div class="c"><h1>Wenn du mit <span style="white-space:nowrap">AI-Agenten</span> arbeitest, solltest du <span class="accent">diesen Git-Befehl</span> kennen.</h1></div></div></body></html>
